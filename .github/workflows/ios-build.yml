name: iOS Build

on:
  push:
    branches:
      - main
      - master
      - 'codex/**'
  pull_request:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Build package for iOS Simulator
        run: |
          set -euo pipefail

          xcodebuild -list > /tmp/xcodebuild-list.txt
          cat /tmp/xcodebuild-list.txt

          SCHEME=""
          if grep -q "DZAnimatedImageKit-Package" /tmp/xcodebuild-list.txt; then
            SCHEME="DZAnimatedImageKit-Package"
          elif grep -q "DZAnimatedImageKit" /tmp/xcodebuild-list.txt; then
            SCHEME="DZAnimatedImageKit"
          else
            echo "Expected scheme not found."
            exit 1
          fi

          echo "Using scheme: ${SCHEME}"
          xcodebuild \
            -scheme "${SCHEME}" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
